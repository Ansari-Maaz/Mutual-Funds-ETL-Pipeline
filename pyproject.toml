[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "global-mutual-fund-etl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pydantic>=2.7,<3", "httpx>=0.27,<1", "PyYAML>=6,<7", "python-dotenv>=1,<2", "openpyxl>=3.1,<4", "pypdf>=5,<6"]

[project.scripts]
mfetl = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
