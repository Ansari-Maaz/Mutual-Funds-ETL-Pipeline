name: US money-market monthly data

on:
  workflow_dispatch:
  schedule:
    # N-MFP filings are monthly; run after the filing window for the prior month.
    - cron: "0 4 15 * *"

permissions:
  contents: read

concurrency:
  group: fundflow-us-sec-nmfp
  cancel-in-progress: false

jobs:
  update-money-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m alembic upgrade head

      - name: Import latest SEC N-MFP month
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HTTP_TIMEOUT_SECONDS: "120"
          USER_AGENT: ${{ secrets.USER_AGENT }}
        run: python -m app.cli sync-sec-nmfp-bulk --months 1 --all --assign-usd-nav

      - name: Audit US coverage after import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.cli audit-us-coverage
