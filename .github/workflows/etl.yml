name: Mutual Fund ETL

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

concurrency:
  group: mutual-fund-etl
  cancel-in-progress: false

jobs:
  etl:
    name: Run Mutual Fund ETL
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m alembic upgrade head

      - name: Synchronize source catalogue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USER_AGENT: ${{ secrets.USER_AGENT }}
        run: python -m app.cli sync-sources

      - name: Run all available connectors
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HTTP_TIMEOUT_SECONDS: "60"
          USER_AGENT: ${{ secrets.USER_AGENT }}
        run: python -m app.cli run --all

      - name: Synchronize SEC portfolio holdings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HTTP_TIMEOUT_SECONDS: "60"
          USER_AGENT: ${{ secrets.USER_AGENT }}
        run: python -m app.cli sync-sec-holdings

      - name: Verify production database counts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from app.db.session import engine

          with engine.connect() as connection:
              funds = connection.execute(text("SELECT COUNT(*) FROM funds")).scalar_one()
              navs = connection.execute(text("SELECT COUNT(*) FROM nav_observations")).scalar_one()
              sources = connection.execute(text("SELECT COUNT(*) FROM sources")).scalar_one()
              holdings = connection.execute(text("SELECT COUNT(*) FROM portfolio_holdings")).scalar_one()

          print(f"Funds: {funds}")
          print(f"NAV observations: {navs}")
          print(f"Sources: {sources}")
          print(f"Portfolio holdings: {holdings}")
          if funds == 0:
              raise SystemExit("ETL workflow completed without any persisted fund records")
          if sources == 0:
              raise SystemExit("Source catalogue initialization did not persist any sources")
          PY
