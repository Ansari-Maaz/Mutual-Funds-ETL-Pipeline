<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="100%" height="100%" rx="18" fill="#f5f8fa"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#18323c}.title{font-size:26px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:14px;fill:#506975}.tiny{font-size:12px;fill:#506975}.box{fill:white;stroke:#b8cbd2;stroke-width:2}.teal{fill:#dff3ee;stroke:#3b9c87;stroke-width:2}.navy{fill:#e5eff9;stroke:#5182ae;stroke-width:2}.line{stroke:#62818c;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#62818c"/></marker></defs>
<text x="32" y="42" class="title">Database entities and key relationships</text>
<rect x="35" y="90" width="220" height="100" rx="14" class="box"/>
<text x="145.0" y="122" text-anchor="middle" class="label">sources</text>
<text x="145.0" y="147" text-anchor="middle" class="small">source_id PK</text>
<rect x="350" y="90" width="250" height="120" rx="14" class="teal"/>
<text x="475.0" y="122" text-anchor="middle" class="label">funds</text>
<text x="475.0" y="147" text-anchor="middle" class="small">id PK • source_id FK</text>
<rect x="760" y="45" width="255" height="100" rx="14" class="box"/>
<text x="887.5" y="77" text-anchor="middle" class="label">nav_observations</text>
<text x="887.5" y="102" text-anchor="middle" class="small">fund_id FK • date/currency unique</text>
<rect x="760" y="185" width="255" height="120" rx="14" class="teal"/>
<text x="887.5" y="217" text-anchor="middle" class="label">portfolio_holdings</text>
<text x="887.5" y="242" text-anchor="middle" class="small">fund_id FK • report-date unique</text>
<rect x="1090" y="185" width="270" height="120" rx="14" class="box"/>
<text x="1225.0" y="217" text-anchor="middle" class="label">holding_metrics</text>
<text x="1225.0" y="242" text-anchor="middle" class="small">holding_id FK • source/as-of unique</text>
<rect x="350" y="410" width="250" height="100" rx="14" class="box"/>
<text x="475.0" y="442" text-anchor="middle" class="label">etl_runs</text>
<text x="475.0" y="467" text-anchor="middle" class="small">source_id FK • Python audit</text>
<rect x="35" y="410" width="250" height="120" rx="14" class="box"/>
<text x="160.0" y="442" text-anchor="middle" class="label">api_etl_runs</text>
<text x="160.0" y="467" text-anchor="middle" class="small">API run • source IDs/results</text>
<rect x="760" y="410" width="255" height="120" rx="14" class="box"/>
<text x="887.5" y="442" text-anchor="middle" class="label">api_source_checks</text>
<text x="887.5" y="467" text-anchor="middle" class="small">source_id FK • check history</text>
<path d="M255 140 H350" class="line"/><text x="280" y="128" class="tiny">1 : many</text>
<path d="M600 115 H680 V95 H760" class="line"/>
<path d="M600 160 H680 V245 H760" class="line"/>
<path d="M1015 245 H1090" class="line"/>
