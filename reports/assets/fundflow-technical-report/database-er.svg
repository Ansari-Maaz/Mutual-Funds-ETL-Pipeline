<path d="M255 465 H690 V465 H760" class="line"/>
<text x="40" y="625" class="small">Natural keys protect source-native funds, NAV observations and historical positions from duplicate ingestion.</text>
<text x="40" y="655" class="small">Holding metrics are separated from filed holdings; missing metrics remain NULL.</text>
</svg>