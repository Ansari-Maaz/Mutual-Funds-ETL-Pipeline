<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="36" y="38" fill="#183244" font-family="Times New Roman,serif" font-size="21" font-weight="700">Database entity relationships</text>
<text x="36" y="62" fill="#77868E" font-family="Times New Roman,serif" font-size="12">Current schema snapshot · primary/foreign keys and core fields only</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#507A9D"/></marker></defs>
<rect x="25" y="105" width="235" height="94" fill="#FFFFFF" stroke="#183244" stroke-width="1.2"/>
<rect x="25" y="105" width="235" height="30" fill="#E9F0F3"/>
<text x="35" y="125" fill="#183244" font-family="Times New Roman,serif" font-size="13" font-weight="700">sources</text>
<text x="35" y="155" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">PK source_id varchar(100)</text>
<text x="35" y="175" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">country_code, organization</text>
<text x="35" y="195" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">verification/integration status</text>
<rect x="315" y="105" width="310" height="134" fill="#FFFFFF" stroke="#183244" stroke-width="1.2"/>
<rect x="315" y="105" width="310" height="30" fill="#E9F0F3"/>
<text x="325" y="125" fill="#183244" font-family="Times New Roman,serif" font-size="13" font-weight="700">funds</text>
<text x="325" y="155" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">PK id integer</text>
<text x="325" y="175" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">FK source_id → sources</text>
<text x="325" y="195" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">UNIQUE (source_id, source_fund_id)</text>
<text x="325" y="215" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">name, domicile_country, currency, ISIN</text>
<text x="325" y="235" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">SEC IDs, holdings status</text>
<rect x="690" y="105" width="390" height="114" fill="#FFFFFF" stroke="#183244" stroke-width="1.2"/>
<rect x="690" y="105" width="390" height="30" fill="#E9F0F3"/>
<text x="700" y="125" fill="#183244" font-family="Times New Roman,serif" font-size="13" font-weight="700">nav_observations</text>
<text x="700" y="155" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">PK id integer</text>
<text x="700" y="175" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">FK fund_id → funds ON DELETE CASCADE</text>
<text x="700" y="195" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">valuation_date, NAV, currency</text>
<text x="700" y="215" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">UNIQUE (fund_id, date, currency)</text>
<rect x="315" y="320" width="350" height="154" fill="#FFFFFF" stroke="#183244" stroke-width="1.2"/>
<rect x="315" y="320" width="350" height="30" fill="#E9F0F3"/>
<text x="325" y="340" fill="#183244" font-family="Times New Roman,serif" font-size="13" font-weight="700">portfolio_holdings</text>
<text x="325" y="370" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">PK id integer</text>
<text x="325" y="390" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">FK fund_id → funds ON DELETE CASCADE</text>
<text x="325" y="410" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">reporting_date, holding_index</text>
<text x="325" y="430" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">security identifiers, quantity, market_value</text>
<text x="325" y="450" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">weight, data_source, accession_number</text>
<text x="325" y="470" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">UNIQUE (fund, date, holding_index)</text>
<rect x="735" y="320" width="345" height="134" fill="#FFFFFF" stroke="#183244" stroke-width="1.2"/>
<rect x="735" y="320" width="345" height="30" fill="#E9F0F3"/>
<text x="745" y="340" fill="#183244" font-family="Times New Roman,serif" font-size="13" font-weight="700">holding_metrics</text>
<text x="745" y="370" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">PK id integer</text>
<text x="745" y="390" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">FK holding_id → portfolio_holdings</text>
<text x="745" y="410" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">as_of_date, optional first_bought_date</text>
<text x="745" y="430" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">share change, 1Y return, forward P/E, sector</text>
<text x="745" y="450" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">source, basis, retrieval time</text>
<rect x="25" y="390" width="235" height="94" fill="#FFFFFF" stroke="#183244" stroke-width="1.2"/>
<rect x="25" y="390" width="235" height="30" fill="#E9F0F3"/>
<text x="35" y="410" fill="#183244" font-family="Times New Roman,serif" font-size="13" font-weight="700">etl_runs</text>
<text x="35" y="440" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">PK id integer</text>
<text x="35" y="460" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">FK source_id → sources (nullable)</text>
<text x="35" y="480" fill="#25343C" font-family="Times New Roman,serif" font-size="10.5">status, counts, timestamps, error</text>
